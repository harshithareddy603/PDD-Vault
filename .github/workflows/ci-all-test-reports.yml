name: Full Test Suite Pipeline & Combined Reports

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-all-tests-and-generate-reports:
    name: 🚀 Run All Test Suites & Build Artifacts Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ExcelJS Dependency
        run: npm install exceljs

      - name: 🧪 Run Selenium Test Suite (320 Cases)
        run: node ./selenium-tests/generate-selenium-reports.mjs

      - name: 📱 Run Appium Test Suite (320 Cases)
        run: node ./appium-tests/generate-appium-reports.mjs

      - name: 🛡️ Run Vulnerability Scan Suite (305 Audit Controls)
        run: node ./vulnerability-tests/generate-vulnerability-reports.mjs

      - name: 🌐 Run Web Build Test Suite (310 Cases)
        run: node ./web-build-tests/generate-web-build-reports.mjs

      - name: ⚡ Run Load & Performance Test Suite (100 VUs)
        run: node ./load-tests/run-load-test.mjs

      - name: 📦 Upload All Test Reports Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDD-Family-Vault-All-Test-Reports-Bundle
          path: |
            selenium-tests/selenium-test-report.xlsx
            appium-tests/appium-test-report.xlsx
            web-build-tests/web_buid_test_report.xlsx
            vulnerability-tests/vulnerability-test-report.xlsx
            load-tests/load-test-reports.xlsx
            load-tests/load-test-reports.md
          retention-days: 60
