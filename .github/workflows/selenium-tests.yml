name: Selenium Test Suite & Report Generator

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-test-suite:
    name: 🧪 Run Selenium Tests & Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ExcelJS Dependency
        run: npm install exceljs

      - name: Execute Selenium Test Suite & Generate Excel Sheet
        run: node ./selenium-tests/generate-selenium-reports.mjs

      - name: Upload Selenium Test Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Test-Report-Excel
          path: selenium-tests/selenium-test-report.xlsx
          retention-days: 30
